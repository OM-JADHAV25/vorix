server:
  port: 8080

spring:
  application:
    name: gateway-service

management:
  endpoint:
    health:
      show-details: always

  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

logging:
  level:
    org.springframework.cloud.gateway: TRACE